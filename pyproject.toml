[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bdhires"
version = "0.1.0"
description = "Generative downscaling and data assimilation for daily rainfall over Bangladesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy", "scipy", "pandas", "xarray", "zarr", "pyyaml", "torch",
]

[project.optional-dependencies]
data = [
  "netcdf4", "h5netcdf", "dask", "xesmf", "rioxarray", "rasterio",
]
earthmover = [
  "icechunk>=2.1.1,<3", "pcodec>=1.0.2", "zarr>=3.2",
]
eval = ["pysteps", "matplotlib", "cartopy"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
