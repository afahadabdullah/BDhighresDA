# ERA5-conditioned prior, single stage, full 1981-2018 record.
# There is no IMERG stage: IMERG is an observation, so the prior is not
# limited to the post-2000 satellite era.  2 x V100 (32 GB).  torchrun --nproc_per_node=2 scripts/train.py --config configs/train_v100.yaml
# V100 is sm_70: no bf16 tensor cores, so utils/dist.amp_dtype falls back to fp16 + GradScaler.
data:
  zarr: data/processed/bd_wide.zarr
  stats: data/processed/stats_v2.json   # v2 conditioning transform; see train_h100.yaml
  crop: 128                 # random 128x128 crops of the 256x256 wide domain
  seasonal_encoding: true
  min_valid_fraction: 0.3   # skip crops that land in the open Bay of Bengal
  monitor_grid: bd
  era5_tp_cond_index: 0
  years:
    train: [1981, 2018]
    val:   [2019, 2020]
    test:  [2021, 2025]

model:
  base_channels: 64
  channel_mult: [1, 2, 3, 4]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  num_heads: 4

train:
  out_dir: runs/prior_v100
  epochs: 400
  batch_size: 8             # per GPU -> global 16
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  ema_decay: 0.999
  cond_dropout: 0.10        # gives an unconditional prior "for free" (SDA mode)
  logit_normal_t: true
  num_workers: 4
  seed: 0
  log_every: 50
  ckpt_every: 5                 # must divide validation.every

validation:
  enabled: true
  start_epoch: 10
  every: 5
  members: 8
  n_steps: 30
  cfg_scale: 2.0
  month: 7
  quantiles: [0.5, 0.99]
  save_maps: true
