# Single H100 (80 GB) -- bigger batch, bf16 autocast selected automatically.
data:
  zarr: data/processed/bd_wide.zarr
  # v3: as v2 (ERA5 tp log1p'd, cape sqrt'd before standardisation) PLUS the
  # residual target parameterisation.  Each statistics file is bound to the
  # checkpoints trained with it and they are NOT interchangeable:
  #   stats.json     v1  absolute target, raw z-scored conditioning
  #   stats_v2.json  v2  absolute target, transformed conditioning
  #   stats_v3.json  v3  residual target, transformed conditioning
  stats: data/processed/stats_v6.json
  crop: 128
  seasonal_encoding: true
  min_valid_fraction: 0.3       # reject random crops that land in the open Bay of
                                # Bengal, where CHIRPS is absent and the loss mask
                                # is empty (docs/DIAGNOSIS_epoch119.md item 6)
  monitor_grid: bd              # fixed 128x128 production grid for the sampled
                                # validation panels (must match data.crop)
  era5_tp_cond_index: 0
  # v6: era5_tp is REMOVED from the conditioning stack. The prior sees the
  # synoptic situation -- moisture, instability, flow, pressure -- plus geography
  # and day-of-year. Every actual precipitation MEASUREMENT (IMERG, PERSIANN,
  # gauges) enters through the observation likelihood instead, where it has an
  # explicit error covariance and can be withheld for validation.
  #
  # This is what makes "the analysis beats every input" a testable claim rather
  # than a hope: with no precipitation product in the conditioning, the prior
  # cannot be accused of copying one.
  cond_channels: [era5_tcwv, era5_cape, era5_u10, era5_v10, era5_msl]
  years:
    train: [1981, 2018]
    val:   [2019, 2020]
    test:  [2021, 2025]

model:
  base_channels: 96
  channel_mult: [1, 2, 3, 4]
  num_res_blocks: 2
  attn_resolutions: [16, 32]
  dropout: 0.2                  # raised from 0.1: v3 overfit by epoch ~100
  num_heads: 4

train:
  # New directory per parameterisation: weights are not comparable across them,
  # and keeping the old ones intact preserves the before/after baselines.
  out_dir: runs/prior_h100_v6
  # 38 train years ~ 13.9k days / batch 32 = ~433 steps/epoch.
  #
  # The v3 run was scheduled for 580 epochs and peaked at epoch 80-125 (35-54k
  # steps), then degraded for 50 epochs. So the earlier "undertrained, needs
  # 250k steps" reading was wrong: with ~14k training days this model overfits
  # well before it underfits.
  #
  # Worse, cosine over 580 epochs left the learning rate at ~87% of maximum at
  # epoch 135 -- it never annealed. 150 epochs (~65k steps) covers the observed
  # peak with room to spare AND decays the LR properly over that range.
  epochs: 150
  batch_size: 32
  lr: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 2000
  grad_clip: 1.0
  use_ema: true                 # RE-ENABLED after v4. Running without it, the
                                # sampled validation peaked at epoch 20-25 and
                                # reversed, and q50 correlation sat at 0.249 vs
                                # v3's 0.349 at the same epoch while every other
                                # metric was tied -- a noisier model, not just a
                                # noisier checkpoint. Flow/diffusion samples come
                                # from an instantaneous weight vector, and at
                                # lr~1.3e-4 that vector is worse than its own
                                # recent average.
  ema_decay: 0.9995             # ~2k steps ~ 4.6 epochs at 433 steps/epoch
  cond_dropout: 0.0             # the CFG sweep showed w>1 DEGRADES placement
                                # (q90 correlation 0.731 at w=1.0 -> 0.510 at
                                # w=2.0) with no effect on bias or spread. At
                                # w=1.0 the unconditional branch is never used,
                                # so paying 10% of the budget for it is waste.
  logit_normal_t: true
  num_workers: 8
  seed: 0
  log_every: 50
  ckpt_every: 5                 # must divide validation.every
  keep_every: 10                # retain epoch_XXXX.pt snapshots (no optimiser
                                # state). v3 peaked near epoch 80 and there was
                                # no way back to it: best.pt and last.pt are
                                # both overwritten every ckpt_every epochs.
  early_stop_patience: 0        # DISABLED. At ~2h45m for the full 150 epochs
                                # the whole run is cheaper than the information
                                # lost by truncating it, and keep_every snapshots
                                # already let you pick the peak afterwards.
                                # Set to 6 (= 30 epochs) for long schedules.

# Sampled validation: runs the real sampler on two fixed held-out July days and
# scores the ensemble in mm/day.  This is the checkpoint-selection signal --
# the flow-matching val loss is too noisy to choose on
# (docs/DIAGNOSIS_epoch119.md item 4).
#
# Cost: members x n_steps x 2 (Heun) x 2 (CFG) NFE per case.  At the defaults
# that is ~2k forward passes at 128x128 per evaluation, a few tens of seconds on
# an H100, ~115 times over a 580-epoch run.
#
# Writes runs/<name>/validation/{history.jsonl, epoch_XXXX.png, progress.png}.
validation:
  enabled: true
  start_epoch: 10               # counted in COMPLETED epochs; first run at 10
  every: 5                      # then every 5th
  members: 8
  n_steps: 30
  cfg_scale: 1.0                # measured on the v3 checkpoint: w=2.0 cost
                                # 0.22 of spatial correlation on the q90 case
                                # while leaving bias and spread unchanged.
                                # Keep in sync with background_sampler in da.yaml.
  month: 7                      # July -- the heart of the BD monsoon
  quantiles: [0.5, 0.99]        # a typical July day and a wet extreme
  save_maps: true
