# Inference / data-assimilation configuration.
data:
  zarr: data/processed/bd_wide.zarr
  stats: data/processed/stats.json
  grid: bd                    # produce output on the 128x128 Bangladesh grid
  imerg_cond_index: null      # read from the zarr attrs written by 04_regrid_and_pack
  era5_tp_cond_index: 0

# ---------------------------------------------------------------------------
# Observation streams.  This is the key architectural switch: IMERG can be a
# CONDITIONING channel of the generative prior, or an OBSERVATION assimilated
# through the likelihood alongside the gauges.  See docs/METHODOLOGY.md S3.6.
#
#   imerg.mode = "condition"   -> prior p(x | ERA5, IMERG); likelihood = gauges only
#   imerg.mode = "assimilate"  -> prior p(x | ERA5);        likelihood = IMERG + gauges
#
# If you set "assimilate" you MUST train with configs/train_era5only.yaml, which
# zeroes the IMERG conditioning channel -- otherwise IMERG is double-counted
# (once in the prior, once in the likelihood) and the analysis is over-confident.
# ---------------------------------------------------------------------------
observations:
  gauges:
    enabled: true
    csv: data/stations/bmd_daily.csv
    min_coverage: 0.5
    sigma_obs: 0.10           # gauge error, TRANSFORMED units (tune first!)
    representativeness: 0.25  # point-vs-5km-cell mismatch; usually dominant

  imerg:
    mode: assimilate          # condition | assimilate
    factor: 2                 # 0.05 deg -> 0.1 deg is an exact 2x2 block mean
    sigma_obs: 0.35           # satellite retrieval error, TRANSFORMED units
    representativeness: 0.10  # footprint-vs-block-mean mismatch (small: H is exact)
    bias_correction: null     # path to data/processed/imerg_qm.npz from script 07

sampler:
  n_steps: 50
  heun: true
  schedule_power: 2.0
  n_corrections: 2            # C in Rozet & Louppe Alg. 4 / Manshausen Table B1
  corrector_tau: 0.3          # tau~
  churn: 0.0
  seed: null

guidance:
  gamma: 1.0e-3               # Manshausen et al. found 1e-3 > 1e-2 for precip
  scale: 1.0
  t_start: 0.10
  t_end: 0.999
  clip_norm: 200.0            # raise when assimilating IMERG: ~3.5k dense obs give a
                              # far larger gradient norm than 35 gauges alone
  huber_delta: null           # ~3.0 for robustness to gauge/satellite outliers

ensemble:
  members: 16

tuning:
  gamma: [1.0e-4, 1.0e-3, 1.0e-2]
  sigma_obs: [0.05, 0.10, 0.20, 0.40]
  imerg_sigma_obs: [0.20, 0.35, 0.60, 1.00]

verification:
  thresholds: [1, 10, 20, 50, 100]
  windows: [1, 3, 5, 9, 17, 33]
