# V7 stage B: 0.1-degree amounts -> 0.05-degree structure, factor 2.
#
# Conservation applies HERE and only here, to the analysed 0.1-degree field --
# which is observed by IMERG, so conserving to it is a statement about data
# rather than about CPC.  At factor 2 a block is four cells, so a gauge acting on
# this stage redistributes over three neighbours instead of ninety-nine, and the
# increment is quantised to 11 km rather than 55 km.
#
# conditioning_augmentation matters more than usual: this stage trains on clean
# 0.1-degree targets but will run on ANALYSED 0.1-degree fields, whose error
# looks nothing like clean CHIRPS.  Calibrate max_coarse_noise against the stage-A
# analysis spread once that exists rather than leaving it at a guess.
stage: allocation
data:
  zarr: data/processed/v7/wide_v7.zarr
  # 120 divides the 240-cell domain, which tiled validation requires -- an
  # overlapping tile would weight some cells twice, so the dataset refuses it.
  # It also survives three downsamplings (120/8 = 15).
  crop: 120
  factor: 2
  downsamplings: 3
  years:
    train: [1981, 2018]
    val: [2019, 2020]
model:
  base_channels: 64
  channel_mult: [1, 2, 3, 4]
  num_res_blocks: 2
  attn_resolutions: [30, 60]
  dropout: 0.15
  num_heads: 4
train:
  out_dir: runs/v7/allocation
  epochs: 400
  batch_size: 16
  lr: 0.00015
  warmup_fraction: 0.02
  lr_min_fraction: 0.01
  precision: bf16
  weight_decay: 0.01
  grad_clip: 1.0
  occurrence_weight: 0.10
  inactive_positive_weight: 0.05
  use_ema: true
  ema_decay: 0.9995
  num_workers: 8
  seed: 7102
  # last.pt and best.pt are rewritten every epoch; this is only how often a
  # checkpoint is KEPT under its own epoch number.  10 over 400 epochs is 40
  # permanent copies -- enough to go back to any part of the run, few enough
  # that the directory stays navigable.
  keep_every: 10
  conditioning_augmentation:
    max_coarse_noise: 1.0
    clean_probability: 0.15
  # The sampled diagnostic, at the same cadence as the kept checkpoints, so the
  # picture and the weights that produced it are always a matched pair.
  #
  # The allocation branch has never had one of these.  Its selection signal is a
  # masked MSE against a random-t velocity target, which barely moves once a run
  # is past its early epochs -- so best.pt has been close to arbitrary.  What
  # this measures instead is the within-block anomaly correlation against the
  # conservative smooth base: the part of the field the branch actually
  # controls, against the null it has to beat.  Conservation error and the seam
  # index ride along, because those are the two ways this stage has failed.
  #
  # Cost: 2 cases x 4 members x 50 steps x 2 evaluations = 800 forward passes
  # every 10 epochs, against ~10^5 for an epoch of training.
  sampled_validation:
    enabled: true
    start_epoch: 10
    every: 10
    cases: 2
    members: 4
    n_steps: 50
    seed: 20220503
    save_maps: true
    # A typical monsoon day and the tail, by rainfall quantile of the validation
    # split -- NOT by calendar position, which lands on dry-season days where a
    # pattern correlation is close to pure noise.
    quantiles: [0.50, 0.95]
