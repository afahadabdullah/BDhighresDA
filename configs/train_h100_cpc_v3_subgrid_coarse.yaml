# Phase 1: native-0.5-degree CPC -> CHIRPS-aggregated coarse hurdle flow.
stage: coarse
data:
  zarr: data/processed/cpc_v3_subgrid/wide_cpc.zarr
  crop: 120
  factor: 10
  downsamplings: 3
  years:
    train: [1981, 2018]
    val: [2019, 2020]
model:
  base_channels: 64
  channel_mult: [1, 2]
  num_res_blocks: 2
  dropout: 0.10
  num_heads: 4
train:
  out_dir: runs/prior_h100_cpc_v3_subgrid/coarse
  epochs: 100
  batch_size: 64
  lr: 0.0002
  precision: bf16
  weight_decay: 0.01
  grad_clip: 1.0
  occurrence_weight: 0.10
  inactive_positive_weight: 0.05
  use_ema: true
  ema_decay: 0.9995
  num_workers: 8
  seed: 3101
  ckpt_every: 5
