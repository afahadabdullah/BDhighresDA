<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 748" width="1480" height="748" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .band     { stroke-width:1.4; stroke-dasharray:7 5; }
      .bandlab  { font-size:13px; font-weight:700; fill:#FFFFFF; }
      .card     { stroke-width:1.2; }
      .ctitle   { font-size:12.5px; font-weight:700; fill:#1F2A37; }
      .csub     { font-size:10px; fill:#6B7785; }
      .body     { font-size:10.5px; fill:#3D4A5A; }
      .small    { font-size:9.5px; fill:#6B7785; }
      .eq       { font-size:11.5px; fill:#1F2A37; }
      .sub      { font-size:8.5px; }
      .lab      { font-size:9px; fill:#8A94A0; }
      .flow     { stroke:#5F7183; stroke-width:2.2; fill:none; marker-end:url(#ah); }
      .flowd    { stroke:#9AA7B4; stroke-width:1.7; fill:none; stroke-dasharray:5 4; marker-end:url(#ahd); }
      .flowobs  { stroke:#C0566B; stroke-width:2.2; fill:none; marker-end:url(#ahr); }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F7183"/></marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA7B4"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0566B"/></marker>

    <filter id="fCoarse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.40  0 0 0 0 0.62  0 1.7 0 0 -0.42"/>
    </filter>
    <filter id="fMid" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.22  0 0 0 0 0.34  0 1.7 0 0 -0.42"/>
    </filter>
    <filter id="fFine" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.115" numOctaves="4" seed="19" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.06  0 0 0 0 0.38  0 0 0 0 0.58  0 1.8 0 0 -0.45"/>
    </filter>
    <filter id="fNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.85" numOctaves="3" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.47  0 0 0 0 0.52  0 1.4 0 0 -0.15"/>
    </filter>
    <filter id="fTerrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="23" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.26  0 1.6 0 0 -0.40"/>
    </filter>
  </defs>

  <!-- ==================== PHASE 1 : TRAINING ==================== -->
  <rect class="band" x="20" y="40" width="1440" height="256" rx="16" fill="#F7FAFC" stroke="#B6C6D4"/>
  <rect x="20" y="26" width="356" height="28" rx="14" fill="#33556E"/>
  <text class="bandlab" x="42" y="45">PHASE 1 · TRAINING — offline, once</text>
  <text class="small" x="392" y="45" font-size="10.5" fill="#33556E">learn the downscaler  p( 5 km rainfall | ERA5 )</text>

  <!-- ERA5 conditioning -->
  <rect class="card" x="44" y="70" width="212" height="200" rx="10" fill="#EAF1F8" stroke="#A9C2DA"/>
  <text class="ctitle" x="56" y="90">Background: ERA5</text>
  <text class="csub"   x="56" y="104">0.25° (~28 km) daily, 1981–2018</text>
  <rect x="56" y="112" width="76" height="76" rx="4" fill="#F7FAFD" stroke="#C9D8E6"/>
  <rect x="56" y="112" width="76" height="76" filter="url(#fCoarse)"/>
  <g stroke="#FFFFFF" stroke-width="0.9" opacity="0.85"><path d="M75,112 V188 M94,112 V188 M113,112 V188 M56,131 H132 M56,150 H132 M56,169 H132"/></g>
  <rect x="56" y="112" width="76" height="76" rx="4" fill="none" stroke="#8FAAC4"/>
  <text class="lab" x="94" y="201" text-anchor="middle">28 km cells</text>
  <text class="body" x="142" y="128">tp</text><text class="small" x="164" y="128">model rain</text>
  <text class="body" x="142" y="145">tcwv</text><text class="small" x="178" y="145">moisture</text>
  <text class="body" x="142" y="162">ivte</text><text class="small" x="174" y="162">transport</text>
  <text class="body" x="142" y="179">ivtn</text><text class="small" x="174" y="179">direction</text>
  <text class="body" x="142" y="196">cape</text><text class="small" x="180" y="196">instability</text>
  <text class="small" x="56" y="222" font-weight="700" fill="#33556E">5 channels — all single-level</text>
  <rect x="56" y="230" width="188" height="30" rx="6" fill="#F7FAFD" stroke="#C9D8E6"/>
  <text class="small" x="64" y="243" font-size="8.8">+ statics: elevation, slope, land mask,</text>
  <text class="small" x="64" y="255" font-size="8.8">lat/lon encoding, sin/cos day-of-year</text>
  <rect x="204" y="228" width="40" height="34" rx="4" fill="#F9FBF8" stroke="#A5BC99"/>
  <rect x="204" y="228" width="40" height="34" filter="url(#fTerrain)"/>

  <path class="flow" d="M256,170 H302"/>
  <text class="lab" x="279" y="162" text-anchor="middle">c</text>

  <!-- U-Net -->
  <rect class="card" x="306" y="70" width="392" height="200" rx="10" fill="#EDF3FC" stroke="#AFC7E6"/>
  <text class="ctitle" x="318" y="90">Flow-matching U-Net</text>
  <g stroke="#9BB6DC" stroke-width="1.3" fill="none" stroke-dasharray="4 3">
    <path d="M373,132 C412,108 590,108 629,132"/><path d="M405,150 C438,130 564,130 597,150"/><path d="M437,166 C462,154 540,154 565,166"/>
  </g>
  <g fill="#8FB3E0" stroke="#5D89C4" stroke-width="1">
    <rect x="351" y="132" width="22" height="90" rx="3"/><rect x="383" y="150" width="22" height="58" rx="3"/><rect x="415" y="166" width="22" height="30" rx="3"/>
    <rect x="565" y="166" width="22" height="30" rx="3"/><rect x="597" y="150" width="22" height="58" rx="3"/><rect x="629" y="132" width="22" height="90" rx="3"/>
  </g>
  <circle cx="501" cy="181" r="16" fill="#7C6BC4" stroke="#5B4CA0"/>
  <text x="501" y="185" text-anchor="middle" font-size="8" fill="#FFFFFF" font-weight="700">attn</text>
  <text class="eq" x="502" y="118" text-anchor="middle">u<tspan class="sub" dy="4">θ</tspan><tspan dy="-4">( x</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">, t, c )   —   velocity field,  ~30 M params</tspan></text>
  <text class="eq" x="502" y="243" text-anchor="middle" font-size="11">x<tspan class="sub" dy="4">t</tspan><tspan dy="-4"> = t·x</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4"> + (1−t)·x</tspan><tspan class="sub" dy="4">0</tspan><tspan dy="-4">     L = E ‖ u</tspan><tspan class="sub" dy="4">θ</tspan><tspan dy="-4"> − (x</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">−x</tspan><tspan class="sub" dy="4">0</tspan><tspan dy="-4">) ‖²</tspan></text>
  <text class="lab" x="502" y="259" text-anchor="middle">random 128×128 crops · conditioning dropout 10%</text>

  <path class="flow" d="M698,170 H744"/>
  <text class="lab" x="721" y="162" text-anchor="middle">x̂₁</text>

  <!-- CHIRPS target -->
  <rect class="card" x="748" y="70" width="212" height="200" rx="10" fill="#EEF7F1" stroke="#A9CDB4"/>
  <text class="ctitle" x="760" y="90" fill="#2E6B47">Target: CHIRPS</text>
  <text class="csub"   x="760" y="104">0.05° (~5 km) daily, 1981–2018</text>
  <rect x="792" y="114" width="124" height="124" rx="5" fill="#FAFCFB" stroke="#9DC4AE"/>
  <rect x="792" y="114" width="124" height="124" filter="url(#fFine)"/>
  <rect x="792" y="114" width="124" height="124" rx="5" fill="none" stroke="#7FA98F"/>
  <text class="lab" x="854" y="252" text-anchor="middle">5 km, land only</text>
  <path class="flowd" d="M840,244 C700,286 620,286 502,272"/>
  <text class="lab" x="676" y="292" text-anchor="middle">flow-matching loss</text>

  <!-- the key message -->
  <rect class="card" x="988" y="70" width="448" height="200" rx="10" fill="#FFF6E3" stroke="#DFBE7E"/>
  <text class="ctitle" x="1010" y="98" font-size="14" fill="#8A5A1E">No observation enters training.</text>
  <text class="body" x="1010" y="124">Gauges and satellite rainfall are used <tspan font-weight="700">nowhere</tspan> in Phase 1.</text>
  <text class="body" x="1010" y="144">The network only ever learns the map</text>
  <text class="eq" x="1010" y="170" font-size="13" font-weight="700">ERA5  0.25°   ⟶   p( rainfall | ERA5 )  at 0.05°</text>
  <text class="body" x="1010" y="198">So the observing network can change — new gauges, IMERG</text>
  <text class="body" x="1010" y="215">V07 → V08, Early instead of Final, radar later — and</text>
  <text class="body" x="1010" y="232"><tspan font-weight="700">nothing needs retraining.</tspan> That is the whole reason for</text>
  <text class="body" x="1010" y="249">putting the background in the prior and observations in the</text>
  <text class="body" x="1010" y="266">likelihood, rather than feeding everything to the network.</text>

  <!-- frozen weights handoff -->
  <path class="flowd" d="M502,296 C502,318 380,320 380,346"/>
  <text class="lab" x="470" y="330" text-anchor="middle">frozen weights θ</text>

  <!-- ==================== PHASE 2 : INFERENCE ==================== -->
  <rect class="band" x="20" y="356" width="1440" height="372" rx="16" fill="#FCF8F9" stroke="#D5B6BE"/>
  <rect x="20" y="342" width="430" height="28" rx="14" fill="#8E3B4E"/>
  <text class="bandlab" x="42" y="361">PHASE 2 · INFERENCE — every day, no retraining</text>
  <text class="small" x="466" y="361" font-size="10.5" fill="#8E3B4E">sample the prior, then assimilate observations while sampling</text>

  <!-- inputs -->
  <rect class="card" x="44" y="386" width="192" height="128" rx="10" fill="#EAF1F8" stroke="#A9C2DA"/>
  <text class="ctitle" x="56" y="406" font-size="11.5">ERA5 for day D</text>
  <rect x="56" y="416" width="64" height="64" rx="4" fill="#F7FAFD" stroke="#C9D8E6"/>
  <rect x="56" y="416" width="64" height="64" filter="url(#fCoarse)"/>
  <rect x="56" y="416" width="64" height="64" rx="4" fill="none" stroke="#8FAAC4"/>
  <text class="small" x="130" y="436">same 5</text>
  <text class="small" x="130" y="450">channels</text>
  <text class="small" x="130" y="464">+ statics</text>
  <text class="lab" x="56" y="500">conditioning  c</text>

  <rect class="card" x="44" y="530" width="192" height="128" rx="10" fill="#F5F5F7" stroke="#C6CBD3"/>
  <text class="ctitle" x="56" y="550" font-size="11.5">Noise draw</text>
  <rect x="56" y="560" width="64" height="64" rx="4" fill="#FAFAFB" stroke="#CBCFD6"/>
  <rect x="56" y="560" width="64" height="64" filter="url(#fNoise)"/>
  <rect x="56" y="560" width="64" height="64" rx="4" fill="none" stroke="#B7BDC6"/>
  <text class="eq" x="130" y="586" font-size="10">x<tspan class="sub" dy="4">0</tspan><tspan dy="-4"> ~ N(0, I)</tspan></text>
  <text class="small" x="130" y="602">one per</text>
  <text class="small" x="130" y="615">member</text>
  <text class="lab" x="56" y="644">16 members</text>

  <path class="flow" d="M236,450 C266,450 266,510 292,510"/>
  <path class="flow" d="M236,594 C266,594 266,530 292,530"/>

  <!-- sampler -->
  <rect class="card" x="296" y="386" width="404" height="272" rx="10" fill="#FFF8EC" stroke="#E3C692"/>
  <text class="ctitle" x="308" y="406">Guided sampling — 50 steps, t : 0 → 1</text>
  <rect x="310" y="416" width="376" height="128" rx="6" fill="#FFFDF8" stroke="#E8D6B4"/>
  <g stroke="#EADFC8" stroke-width="0.8"><path d="M310,448 H686 M310,480 H686 M310,512 H686"/></g>
  <g fill="none" stroke-width="1.5" opacity="0.92">
    <path d="M320,532 C420,506 560,478 678,462" stroke="#5D89C4"/>
    <path d="M320,506 C420,494 560,480 678,470" stroke="#7C6BC4"/>
    <path d="M320,482 C420,481 560,481 678,482" stroke="#3F8F6E"/>
    <path d="M320,456 C420,466 560,478 678,494" stroke="#C08A2E"/>
    <path d="M320,430 C420,452 560,476 678,506" stroke="#C0392B"/>
  </g>
  <g stroke="#C58A96" stroke-width="1.1" stroke-dasharray="3 3"><path d="M400,416 V544"/><path d="M480,416 V544"/><path d="M560,416 V544"/><path d="M640,416 V544"/></g>
  <text class="lab" x="320" y="558">t = 0   noise</text>
  <text class="lab" x="676" y="558" text-anchor="end">t = 1   5 km field</text>
  <text class="eq" x="308" y="582" font-size="11">every step:   dx = ( u<tspan class="sub" dy="4">θ</tspan><tspan dy="-4">(x</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">, t, c)</tspan>
    <tspan fill="#9C3B4C" font-weight="700"> + Δu</tspan><tspan dy="4" class="sub" fill="#9C3B4C">obs</tspan><tspan dy="-4"> ) dt</tspan></text>
  <rect x="308" y="592" width="380" height="54" rx="6" fill="#FDF3E0" stroke="#E3C692"/>
  <text class="small" x="316" y="607" font-size="9">Observations off  →  <tspan font-weight="700">BACKGROUND</tspan> (first guess from ERA5 alone)</text>
  <text class="small" x="316" y="621" font-size="9">Observations on   →  <tspan font-weight="700" fill="#9C3B4C">ANALYSIS</tspan> (the product)</text>
  <text class="small" x="316" y="638" font-size="9">Spread: x₀ draw × prior temperature T · EDA member · perturbed y</text>

  <!-- observations feeding in -->
  <rect class="card" x="724" y="386" width="330" height="272" rx="10" fill="#FDEFF1" stroke="#E3A9B4"/>
  <text class="ctitle" x="736" y="406" fill="#8E3B4E">Observations  y  — inference only</text>
  <rect x="736" y="418" width="74" height="74" rx="4" fill="#FBFCFD" stroke="#D6C3C8"/>
  <path d="M744,484 C751,462 757,478 766,452 C775,432 784,446 795,434 L802,428" fill="none" stroke="#C9D6E2" stroke-width="1.2"/>
  <g fill="#C0392B">
    <circle cx="750" cy="436" r="2.5"/><circle cx="770" cy="446" r="2.5"/><circle cx="792" cy="438" r="2.5"/>
    <circle cx="746" cy="460" r="2.5"/><circle cx="768" cy="470" r="2.5"/><circle cx="790" cy="464" r="2.5"/>
    <circle cx="756" cy="482" r="2.5"/><circle cx="780" cy="484" r="2.5"/>
  </g>
  <rect x="736" y="418" width="74" height="74" rx="4" fill="none" stroke="#C79AA3"/>
  <text class="lab" x="773" y="505" text-anchor="middle">~35 BMD gauges</text>
  <text class="small" x="773" y="518" text-anchor="middle" font-size="8.5">H = bilinear</text>
  <rect x="828" y="418" width="74" height="74" rx="4" fill="#FDF9FA" stroke="#D6C3C8"/>
  <rect x="828" y="418" width="74" height="74" filter="url(#fMid)"/>
  <g stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"><path d="M840.3,418 V492 M852.6,418 V492 M865,418 V492 M877.3,418 V492 M889.6,418 V492 M828,430.3 H902 M828,442.6 H902 M828,455 H902 M828,467.3 H902 M828,479.6 H902"/></g>
  <rect x="828" y="418" width="74" height="74" rx="4" fill="none" stroke="#C79AA3"/>
  <text class="lab" x="865" y="505" text-anchor="middle">~3.5k IMERG 0.1°</text>
  <text class="small" x="865" y="518" text-anchor="middle" font-size="8.5">H = exact 2×2 mean</text>
  <text class="small" x="918" y="440" font-size="9">σ<tspan class="sub" dy="3">IMERG</tspan><tspan dy="-3"> ≈ 3–5× σ</tspan><tspan class="sub" dy="3">gauge</tspan></text>
  <text class="small" x="918" y="456" font-size="9">satellite fixes</text>
  <text class="small" x="918" y="468" font-size="9">the pattern,</text>
  <text class="small" x="918" y="480" font-size="9">gauges fix the</text>
  <text class="small" x="918" y="492" font-size="9">amplitude</text>
  <text class="eq" x="889" y="546" text-anchor="middle" font-size="10.5">p(y | x<tspan class="sub" dy="4">t</tspan><tspan dy="-4">) = N( y | H(x̂</tspan><tspan class="sub" dy="4">1</tspan><tspan dy="-4">),  R + Γ(1−t)²/t² )</tspan></text>
  <text class="eq" x="889" y="570" text-anchor="middle" font-size="11" font-weight="700" fill="#9C3B4C">Δu<tspan class="sub" dy="4">obs</tspan><tspan dy="-4"> = ((1−t)/t) · ∇</tspan><tspan class="sub" dy="3">x</tspan><tspan dy="-3"> log p(y | x</tspan><tspan class="sub" dy="4">t</tspan><tspan dy="-4">)</tspan></text>
  <rect x="736" y="586" width="306" height="60" rx="6" fill="#FBE6E9" stroke="#E3A9B4"/>
  <text class="small" x="744" y="601" font-size="8.8" fill="#9C3B4C">IMERG is quantile-mapped to CHIRPS first — a Gaussian</text>
  <text class="small" x="744" y="613" font-size="8.8" fill="#9C3B4C">likelihood assumes an unbiased observation.</text>
  <text class="small" x="744" y="631" font-size="8.8" fill="#9C3B4C">Each member assimilates its own draw y<tspan class="sub" dy="3">r</tspan><tspan dy="-3"> = y + ε</tspan><tspan class="sub" dy="3">r</tspan><tspan dy="-3">.</tspan></text>

  <path class="flowobs" d="M724,522 H700"/>
  <text class="lab" x="712" y="514" text-anchor="middle" fill="#C0566B">Δu</text>

  <!-- output -->
  <rect class="card" x="1078" y="386" width="358" height="272" rx="10" fill="#EEF7F1" stroke="#A9CDB4"/>
  <text class="ctitle" x="1090" y="406" fill="#2E6B47">Analysis — 5 km daily ensemble</text>
  <rect x="1120" y="424" width="104" height="104" rx="5" fill="#F4F9F6" stroke="#B9D5C4"/>
  <rect x="1112" y="416" width="104" height="104" rx="5" fill="#F4F9F6" stroke="#B9D5C4"/>
  <rect x="1104" y="408" width="104" height="104" rx="5" fill="#FAFCFB" stroke="#9DC4AE"/>
  <rect x="1104" y="408" width="104" height="104" filter="url(#fFine)"/>
  <g fill="#C0392B"><circle cx="1126" cy="428" r="1.9"/><circle cx="1154" cy="438" r="1.9"/><circle cx="1182" cy="430" r="1.9"/><circle cx="1120" cy="462" r="1.9"/><circle cx="1150" cy="474" r="1.9"/><circle cx="1180" cy="468" r="1.9"/><circle cx="1132" cy="496" r="1.9"/><circle cx="1168" cy="500" r="1.9"/></g>
  <rect x="1104" y="408" width="104" height="104" rx="5" fill="none" stroke="#7FA98F"/>
  <text class="lab" x="1164" y="542" text-anchor="middle">16 members · 0.05° · 128×128</text>
  <rect x="1248" y="416" width="172" height="112" rx="6" fill="#FBFDFC" stroke="#C6DCCF"/>
  <path d="M1364,508 L1412,520 L1364,520 Z" fill="#C0392B" opacity="0.16"/>
  <path d="M1258,520 C1286,520 1296,432 1318,432 C1340,432 1346,496 1364,508 C1382,517 1396,519 1412,520" fill="none" stroke="#3F8F6E" stroke-width="1.8"/>
  <path d="M1258,520 C1286,520 1298,448 1320,448 C1342,448 1350,502 1368,512 C1386,518 1398,519 1412,520" fill="none" stroke="#5D89C4" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M1258,520 H1414" stroke="#B7C6BD" stroke-width="1"/>
  <text class="lab" x="1334" y="428" text-anchor="middle" font-size="8">analysis vs CHIRPS PDF</text>
  <text class="lab" x="1388" y="500" text-anchor="middle" font-size="8">heavy tail</text>
  <text class="small" x="1090" y="566">Verify at <tspan font-weight="700">withheld</tspan> gauges (3-fold CV): CRPS · RMSE/MAE ·</text>
  <text class="small" x="1090" y="580">FSS · SAL · POD/FAR/CSI · and — because generative DA is</text>
  <text class="small" x="1090" y="594">reliably under-dispersive — <tspan font-weight="700" fill="#9C3B4C">spread–skill by intensity</tspan> and</text>
  <text class="small" x="1090" y="608"><tspan font-weight="700" fill="#9C3B4C">rank histograms</tspan> with observation error added to members.</text>
  <text class="small" x="1090" y="628">Baselines: ERA5 · IMERG · CHIRPS · kriging · deterministic U-Net</text>
  <text class="small" x="1090" y="646" fill="#9C3B4C">Target: −10% RMSE at left-out stations (Manshausen et al. 2025)</text>

  <path class="flow" d="M700,470 C712,470 1050,470 1074,470"/>
  <text class="lab" x="890" y="386" text-anchor="middle"> </text>

